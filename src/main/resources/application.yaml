server:
  port: 8080

spring:
  application:
    name: order

  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_DB}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    baseline-on-migrate: true
    schemas: orders

  jpa:
    properties:
      hibernate:
        default_schema: orders

# JSON logs on stdout, collected by Alloy and shipped to Loki (see the observability repo)
logging:
  structured:
    format:
      console: ecs
  level:
    store: info

management:
  endpoints:
    web:
      base-path: /order/actuator
      exposure:
        include: [ 'health', 'info', 'prometheus' ]
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # buckets so Grafana can compute p95/p99 latency
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s
