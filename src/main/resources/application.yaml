server:
  port: 8080

spring:
  application:
    name: order

  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_DB}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    baseline-on-migrate: true
    schemas: orders

  jpa:
    properties:
      hibernate:
        default_schema: orders

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
      connect-timeout: 500ms

  cache:
    type: redis

store:
  cache:
    products-ttl: ${CACHE_PRODUCTS_TTL:5m}
    exchanges-ttl: ${CACHE_EXCHANGES_TTL:1m}

management:
  endpoints:
    web:
      base-path: /order/actuator
      exposure:
        include: [ 'health', 'prometheus' ]
