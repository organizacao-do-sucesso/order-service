apiVersion: v1
kind: ConfigMap
metadata:
  name: order-config
  namespace: store
data:
  DATABASE_HOST: db
  DATABASE_PORT: "5432"
  DATABASE_DB: store
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  namespace: store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
      annotations:
        # scraped by the observability stack (organizacao-do-sucesso/observability)
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /order/actuator/prometheus
    spec:
      containers:
        - name: order
          image: store/order:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: order-config
            - secretRef:
                name: order-secret
          startupProbe:
            httpGet:
              path: /order/actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /order/actuator/health/readiness
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /order/actuator/health/liveness
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: order
  namespace: store
spec:
  selector:
    app: order
  ports:
    - name: http
      port: 8080
      targetPort: http
